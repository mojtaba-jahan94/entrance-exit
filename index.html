<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" sizes="180x180" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1F2933" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F7F2" />
    <meta name="description" content="سامانه هوشمند ثبت ورود و خروج، شیفت شناور، محاسبه اضافه کاری، تاخیر و مرخصی بر پایه تقویم شمسی" />
    <title>سامانه مدیریت تردد و کارکرد | تقویم شمسی</title>
    <!-- Google Fonts: Vazirmatn -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var KEY = 'entrance_exit_ui_settings_v2';
          var LEGACY_KEY = 'entrance_exit_app_theme';
          if (localStorage.getItem(LEGACY_KEY)) {
            localStorage.removeItem(LEGACY_KEY);
          }
          var raw = localStorage.getItem(KEY);
          var mode = 'auto';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && (parsed.themeMode === 'dark' || parsed.themeMode === 'light' || parsed.themeMode === 'auto')) {
              mode = parsed.themeMode;
            } else if (parsed && parsed.isLightMode !== undefined) {
              mode = parsed.isLightMode ? 'light' : 'dark';
            }
          }
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var effective = mode === 'dark' ? 'dark' : (mode === 'light' ? 'light' : (prefersDark ? 'dark' : 'light'));
          document.documentElement.setAttribute('data-theme', effective);
          document.documentElement.style.colorScheme = effective;
          if (effective === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-[#A68A64] selection:text-[#1F2933] min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
